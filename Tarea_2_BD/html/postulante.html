<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Postulante - CT USM</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding: 10px 0; }
        .btn { padding: 8px 16px; margin: 5px; background-color: #4CAF50; color: white; border: none; cursor: pointer; text-decoration: none; border-radius: 4px; }
        .btn:hover { background-color: #45a049; }
        .btn-secondary { background-color: #008CBA; }
        .btn-secondary:hover { background-color: #007399; }
        .btn-danger { background-color: #f44336; }
        .btn-danger:hover { background-color: #da190b; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
        tr:hover { background-color: #f5f5f5; }
        .alert { padding: 15px; margin: 20px 0; border-radius: 4px; font-weight: bold; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .close-alert { float: right; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mis Postulaciones</h1>
        <div>
            <span>Bienvenido: <strong id="usuario">Cargando...</strong></span>
            <a href="../php/logout.php" class="btn btn-danger">Salir</a>
        </div>
    </div>

    <div id="alertas"></div>

    <div style="margin: 20px 0;">
        <a href="registrar_postulacion.html" class="btn btn-secondary">+ Crear Nueva Postulación</a>
    </div>

    <table id="postulacionesTable">
        <thead>
            <tr>
                <th>N° Postulación</th>
                <th>Iniciativa</th>
                <th>Empresa</th>
                <th>Presupuesto</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <tr>
                <td colspan="7" style="text-align: center; padding: 20px;">Cargando postulaciones...</td>
            </tr>
        </tbody>
    </table>

    <script>
        // Cargar nombre del usuario
        fetch('../php/obtener_usuario.php')
            .then(response => response.json())
            .then(data => {
                if (data.nombre) {
                    document.getElementById('usuario').textContent = data.nombre;
                }
            })
            .catch(error => console.error('Error:', error));

        // Mostrar alertas de sesión (si las hay)
        function mostrarAlerta(tipo, mensaje) {
            const alertasDiv = document.getElementById('alertas');
            const alert = document.createElement('div');
            alert.className = `alert alert-${tipo}`;
            alert.innerHTML = `
                ${mensaje}
                <span class="close-alert" onclick="this.parentElement.remove();">&times;</span>
            `;
            alertasDiv.appendChild(alert);

            // Auto-cerrar después de 5 segundos
            setTimeout(() => {
                if (alert.parentElement) alert.remove();
            }, 5000);
        }

        // Cargar postulaciones
        fetch('../php/postulante.php')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('tbody');
                tbody.innerHTML = '';

                if (data.error) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Error: ' + data.error + '</td></tr>';
                    return;
                }

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No tienes postulaciones aún</td></tr>';
                    return;
                }

                data.forEach(post => {
                    const row = `<tr>
                        <td>${post.numero_postulacion}</td>
                        <td>${post.nombre_iniciativa}</td>
                        <td>${post.empresa}</td>
                        <td>$${parseFloat(post.presupuesto).toLocaleString('es-CL')}</td>
                        <td>${post.estado}</td>
                        <td>${post.fecha_postulacion}</td>
                        <td>
                            <a href="ver_postulacion.html?codigo=${post.codigo_interno}" class="btn" style="padding: 5px 10px; font-size: 12px;">Ver</a>
                            ${post.estado === 'Borrador' ? `
                                <a href="editar_postulacion.html?codigo=${post.codigo_interno}" class="btn btn-secondary" style="padding: 5px 10px; font-size: 12px;">Editar</a>
                                <button onclick="enviarPostulacion(${post.codigo_interno})" class="btn" style="padding: 5px 10px; font-size: 12px; background-color: #FF9800;">Enviar</button>
                            ` : ''}
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('tbody').innerHTML = '<tr><td colspan="7" style="text-align: center; color: red;">Error al cargar postulaciones</td></tr>';
            });

        function enviarPostulacion(codigo) {
            if (confirm('¿Enviar esta postulación? No podrás editarla después.')) {
                fetch('../php/enviar_postulacion.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'codigo=' + codigo
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        mostrarAlerta('success', '✓ Postulación enviada correctamente');
                        setTimeout(() => location.reload(), 1500);
                    } else {
                        mostrarAlerta('error', '✗ Error: ' + data.message);
                    }
                });
            }
        }
    </script>
</body>
</html>
